name: Tests et score
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Calculer le score
        run: bash verifier.sh points
